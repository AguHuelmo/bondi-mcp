spring:
  application:
    name: mcp-stm-montevideo

  # La base se levanta aparte, a mano (ver README). La app no administra contenedores.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mcp_stm_montevideo}
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:password}

  jpa:
    hibernate:
      # El esquema lo maneja Flyway. Nunca generar DDL desde las entidades.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  http:
    clients:
      # Ningún fallo de la API externa debe colgar un request nuestro.
      connect-timeout: 5s
      read-timeout: 10s

  ai:
    mcp:
      server:
        name: mcp-stm-montevideo
        version: 0.0.1
        # Streamable HTTP: esto corre como servicio web, no como proceso stdio.
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp

montevideo:
  api:
    base-url: https://api.montevideo.gub.uy/api/transportepublico
    token-url: https://mvdapi-auth.montevideo.gub.uy/token
    # Credenciales OAuth2 client_credentials del portal api.montevideo.gub.uy.
    # Nunca hardcodear: en local salen de config/application.yaml (ignorado por git) y en
    # producción de estas variables de entorno. Ver README.
    #
    # El default vacío es a propósito: sin él, un placeholder sin resolver se bindea como el
    # texto literal "${MONTEVIDEO_CLIENT_ID}" y la app arranca con esa basura de credencial.
    # Vacío + @Validated hace que falle al arrancar con un mensaje claro.
    client-id: ${MONTEVIDEO_CLIENT_ID:}
    client-secret: ${MONTEVIDEO_CLIENT_SECRET:}
  paradas:
    # TTL del cache de paradas. Se refresca al vencer, de forma perezosa.
    cache-ttl: 24h
    max-resultados-busqueda: 20
  geocoder:
    # Servicio Único de Direcciones Geográficas del Uruguay (IDE). Abierto y sin credenciales,
    # a diferencia del de transporte. Es lo que permite buscar "gabriel pereira 2470".
    base-url: https://direcciones.ide.uy/api
    # Cubre todo el país: sin esto una calle homónima se resuelve en otro departamento.
    departamento: MONTEVIDEO

# Bot de Telegram (opcional). Con solo el token ya funciona en modo comandos: sin LLM, sin
# ningún costo por mensaje, apto para dejarlo público. La API key de Anthropic es un extra que
# lo hace entender lenguaje natural; cada mensaje pasa por Claude y lo pagás vos, así que es
# para uso propio o demos, no para abrirlo al mundo.
bot:
  telegram:
    # Token de @BotFather. En local va en config/application.yaml, nunca acá.
    token: ${TELEGRAM_BOT_TOKEN:}
  whatsapp:
    # Cloud API de Meta (developers.facebook.com). A diferencia de Telegram necesita una URL
    # HTTPS pública para el webhook /webhook/whatsapp; ver README. Siempre en modo comandos.
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    # Opcional pero recomendado: con el app secret se verifica la firma de cada webhook.
    app-secret: ${WHATSAPP_APP_SECRET:}
  claude:
    # Opcional. API key de Anthropic (https://platform.claude.com). Misma regla que arriba.
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-4-8

logging:
  level:
    com.bondi_mcp.mcp_stm_montevideo: INFO
