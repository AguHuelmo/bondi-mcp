services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_DB: mcp_stm_montevideo
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mcp -d mcp_stm_montevideo']
      interval: 5s
      timeout: 5s
      retries: 10
